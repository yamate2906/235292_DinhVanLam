services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: admin2906/backend:latest
    container_name: classroom-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:4173

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: admin2906/frontend:latest
    container_name: classroom-frontend
    restart: unless-stopped
    ports:
      - "4173:80"
    environment:
      - PORT=80
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
